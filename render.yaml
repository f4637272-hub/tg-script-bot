services:
  - type: web
    name: tg-script-bot
    env: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: BOT_USERNAME
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: CHANNEL_ID
        sync: false
      - key: CHAT_ID
        sync: false
      - key: CHANNEL_URL
        sync: false
      - key: CHAT_URL
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: WEBHOOK_HOST
        sync: false